<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only jarvis user can own the service -->
  <policy user="jarvis">
    <allow own="com.jarvis.Core"/>
  </policy>

  <!-- Allow anyone to invoke methods on the service -->
  <policy context="default">
    <allow send_destination="com.jarvis.Core"/>
    <allow receive_sender="com.jarvis.Core"/>
  </policy>
</busconfig>
